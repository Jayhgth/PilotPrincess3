name: Release desktop apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  build-macos:
    name: macOS ARM64
    needs: validate
    runs-on: macos-14
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:icons
      - run: pnpm build
      - name: Require Apple release credentials
        shell: bash
        run: |
          [[ -n "$CSC_LINK" ]] || { echo "Missing required macOS release secret: CSC_LINK" >&2; exit 1; }
          [[ -n "$CSC_KEY_PASSWORD" ]] || { echo "Missing required macOS release secret: CSC_KEY_PASSWORD" >&2; exit 1; }
          [[ -n "$APPLE_API_KEY_CONTENT" ]] || { echo "Missing required macOS release secret: APPLE_API_KEY" >&2; exit 1; }
          [[ -n "$APPLE_API_KEY_ID" ]] || { echo "Missing required macOS release secret: APPLE_API_KEY_ID" >&2; exit 1; }
          [[ -n "$APPLE_API_ISSUER" ]] || { echo "Missing required macOS release secret: APPLE_API_ISSUER" >&2; exit 1; }
      - name: Prepare App Store Connect API key
        shell: bash
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
      - name: Build, sign, and notarize macOS app
        run: pnpm exec electron-builder --config apps/desktop/electron-builder.yml --mac dmg zip --arm64 --publish never -c.forceCodeSigning=true
      - name: Verify notarized macOS app
        shell: bash
        run: |
          app_path="release/mac-arm64/Pilot Princess.app"
          codesign --verify --deep --strict --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          if-no-files-found: error
          path: |
            release/Pilot-Princess-mac-arm64.dmg
            release/Pilot-Princess-mac-arm64.zip
            release/Pilot-Princess-mac-arm64.zip.blockmap
            release/latest-mac.yml

  build-windows:
    name: Windows x64 and ARM64
    needs: validate
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:icons
      - run: pnpm build
      - run: pnpm exec electron-builder --config apps/desktop/electron-builder.yml --win nsis --x64 --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            release/Pilot-Princess-win-x64.exe
            release/Pilot-Princess-win-x64.exe.blockmap
            release/Pilot-Princess-win-arm64.exe
            release/Pilot-Princess-win-arm64.exe.blockmap
            release/latest.yml

  publish:
    name: Publish GitHub release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create release and upload installers
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release/* --generate-notes --title "Pilot Princess $GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          fi
